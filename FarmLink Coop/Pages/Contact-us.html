
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Contact Us | FarmLink</title>
  <link rel="stylesheet" href="style.css">
  <script src="java.js" defer></script>
</head>
<body>
<div id="site-header"></div>

<main>
  <section class="page-banner">
    <h2>Contact FarmLink</h2>
    <p>We welcome questions and inquiries
    about the cooperative.</p>
  </section>

  <section class="section">
    <h2>Get in Touch</h2>
    <div class="card-grid">
      <article class="card">
        <h3>Location</h3>
        <p>Zambia</p>
        <p>Full address to be added.</p>
      </article>

      <article class="card">
        <h3>Telephone</h3>
        <p>Contact number to be added.</p>
      </article>

      <article class="card">
        <h3>Email</h3>
        <p>Official email to be added.</p>
      </article>
    </div>
  </section>

  <section class="section form-section">
    <h2>Send Us a Message</h2>
    <p>
      Demonstration only: this form does
      not send or store messages yet.
    </p>

    <form onsubmit="event.preventDefault();
      alert('Demo only: message sending is not connected yet.');">

      <label for="contact-name">Full Name</label>
      <input id="contact-name" type="text" required>
      <br>

      <label for="contact-email">Email Address</label>
      <input id="contact-email" type="email" required>
    <br>

      <label for="contact-subject">Subject</label>
      <select id="contact-subject" required>
        <option value="">Choose a subject</option>
        <option>Membership</option>
        <option>Farm Inputs</option>
        <option>Farm Products</option>
        <option>General Inquiry</option>
      </select>

      <label for="contact-message">Message</label>
      <br>
      <textarea id="contact-message"
                rows="6" required></textarea>
                

      <button type="submit">Send Message</button>
    </form>
  </section>
</main>

<div id="site-footer"></div>
</body>
</html>
